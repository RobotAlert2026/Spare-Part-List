<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ฐานข้อมูลอะไหล่เครื่องจักร พร้อมข้อมูลอ้างอิงและเครื่องจักรที่ใช้งาน">
<meta name="theme-color" content="#efedee">
<title>Spare Part List</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">ข้ามไปยังรายการอะไหล่</a>
<header class="site-header shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div>
        <p class="brand-kicker text-xs uppercase tracking-[.18em]">EQUIPMENT · OJMT</p>
        <h1 class="text-2xl font-bold mt-1">Spare Part List</h1>
        <p class="site-subtitle text-sm mt-1">ฐานข้อมูลเครื่องจักรและอะไหล่</p>
      </div>
      <div class="header-tools flex gap-2 items-center flex-wrap">
        <button id="themeToggle" class="btn theme-toggle" type="button" aria-label="เปลี่ยนเป็นโหมดมืด" title="เปลี่ยนเป็นโหมดมืด">โหมดมืด</button>
        <div class="language-switcher" role="group" aria-label="แปลภาษา">
          <span class="language-switcher-label" title="แปลภาษา">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"></path></svg>
            <span class="sr-only">แปลภาษา</span>
          </span>
          <div id="google_translate_element"></div>
        </div>
        <div class="flex gap-2 items-center" id="adminBar"></div>
      </div>
    </div>
    <label id="searchLabel" class="sr-only" for="q">ค้นหาเครื่องจักร</label>
    <input id="q" type="search" placeholder="ค้นหา Part No., ชื่ออะไหล่, ยี่ห้อ, รหัสหรือชื่อเครื่องจักร" class="inp mt-5 text-base sm:text-lg" autocomplete="off">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-3 mt-4 text-sm" id="stats" aria-live="polite"></div>
  </div>
</header>

<main id="main" class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
  <div id="authNotice" class="auth-notice" role="status" aria-live="polite" hidden></div>
  <div id="modeBanner" role="status" aria-live="polite"></div>
  <p id="connectionStatus" class="text-xs mb-3" style="color:var(--mute)" role="status"></p>
  <nav class="flex gap-2 mb-5" aria-label="เมนูหลัก">
    <button id="navMachines" class="btn" type="button" aria-pressed="true" onclick="showMachines()">เครื่องจักร</button>
    <button id="navParts" class="btn" type="button" aria-pressed="false" onclick="showParts()">อะไหล่ทั้งหมด</button>
  </nav>
  <section id="machineDirectory" class="mb-6" aria-labelledby="machineHeading">
    <div class="flex items-end justify-between gap-3 flex-wrap mb-4">
      <div><p class="text-xs uppercase tracking-wider" style="color:var(--mute)">Machine directory</p><h2 id="machineHeading" class="text-2xl font-bold mt-1">เลือกเครื่องจักร</h2><p class="text-sm mt-1" style="color:var(--mute)">เปิดโปรไฟล์เพื่อดูข้อมูลเครื่องและอะไหล่ที่เกี่ยวข้อง</p></div>
      <button class="btn" type="button" onclick="showParts()">ดูรายการอะไหล่ทั้งหมด</button>
    </div>
    <div id="machineGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>
  <section id="catalogControls" class="bg-white border rounded-xl p-4 sm:p-5 mb-5 shadow-sm" style="border-color:var(--line)" aria-label="ค้นหาและกรองรายการ" hidden>
    <div class="flex items-end justify-between gap-3 flex-wrap mb-3">
      <div><h2 class="font-bold text-lg">รายการอะไหล่</h2><p class="text-sm" style="color:var(--mute)">กรองตามพื้นที่ใช้งานและหมวดหมู่</p></div>
      <div class="flex gap-2 flex-wrap">
        <button id="exportCsv" class="btn text-sm" type="button">ส่งออก CSV</button>
        <button id="clearFilters" class="btn text-sm" type="button">ล้างตัวกรอง</button>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
      <div><label class="lbl mt-0" for="fDept">แผนก</label><select id="fDept" class="inp"></select></div>
      <div><label class="lbl mt-0" for="fMach">เครื่องจักร</label><select id="fMach" class="inp"></select></div>
      <div><label class="lbl mt-0" for="fCat">หมวดหมู่</label><select id="fCat" class="inp"></select></div>
      <div><label class="lbl mt-0" for="fSystem">ระบบย่อย</label><select id="fSystem" class="inp"></select></div>
      <fieldset class="min-w-0"><legend class="lbl mt-0">รูปแบบแสดงผล</legend><div class="flex gap-2">
        <button class="btn flex-1" type="button" data-view="grid" aria-pressed="true">การ์ด</button>
        <button class="btn flex-1" type="button" data-view="table" aria-pressed="false">ตาราง</button>
      </div></fieldset>
    </div>
  </section>
  <section id="partsSection" hidden>
    <section id="machineSummary" class="machine-summary" aria-live="polite" hidden></section>
    <section id="printView" hidden></section>
    <div class="flex items-center justify-between gap-3 mb-3"><p id="count" class="text-sm" style="color:var(--mute)" aria-live="polite"></p></div>
    <div id="list" aria-live="polite"></div>
  </section>
</main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="app.js"></script>
<script>
window.googleTranslateElementInit = function() {
  new google.translate.TranslateElement({ pageLanguage: "th", includedLanguages: "th,en,zh-CN", autoDisplay: false }, "google_translate_element");
  const languageSelect = document.querySelector("#google_translate_element select");
  if (languageSelect) {
    languageSelect.setAttribute("aria-label", "เลือกภาษาที่ต้องการแปล");
    languageSelect.setAttribute("title", "เลือกภาษาที่ต้องการแปล");
  }
};

const translateScript = document.createElement("script");
translateScript.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
translateScript.onerror = () => {
  const widget = document.getElementById("google_translate_element");
  widget.textContent = "โหลดตัวแปลภาษาไม่สำเร็จ กรุณาลองใหม่อีกครั้ง";
  widget.classList.add("translate-widget-error");
  console.error("Google Translate widget failed to load.");
};
document.body.appendChild(translateScript);
</script>
</body>
</html>
